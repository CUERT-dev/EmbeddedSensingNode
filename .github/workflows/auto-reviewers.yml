name: Auto Request Reviewers

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

jobs:
  auto-request:
    name: Assign Designated Reviewers
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Request Reviewers by Base Branch
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;

            let requestedReviewers = [];
            if (base === 'Developing') {
              requestedReviewers = ['ali44455', '2-Farah-1'];
            } else if (base === 'Maintaining') {
              requestedReviewers = ['ali44455', '2-Farah-1'];
            } else if (base === 'Validating') {
              requestedReviewers = ['Eyad-Attwa231', 'abdelwadoud299'];
            }

            // Exclude the PR author from the review request list
            requestedReviewers = requestedReviewers.filter(r => r.toLowerCase() !== author.toLowerCase());

            if (requestedReviewers.length > 0) {
              console.log(`Requesting reviews for PR #${prNumber} targeting ${base}: ${requestedReviewers.join(', ')}`);
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: requestedReviewers
                });
                console.log('Successfully requested reviewers.');
              } catch (err) {
                console.error(`Failed to request reviewers: ${err.message}`);
              }
            } else {
              console.log('No eligible external reviewers to request.');
            }
