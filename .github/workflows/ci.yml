name: CI

on:
  push:
    branches: [Developing, Testing, Validating]
  pull_request:
    branches: [Developing, Testing, Validating]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - env:
          base: ${{ github.base_ref }}
          head: ${{ github.head_ref }}
        run: |
          case "$base" in
            Developing) [[ "$head" == Feature/* || "$head" == Fix/* || "$head" == Docs/* || "$head" == Chore/* || "$head" == "GeneratingTheProject" ]] ;;
            Testing) [[ "$head" == "Developing" ]] ;;
            Validating) [[ "$head" == "Testing" ]] ;;
            *) false ;;
          esac || { echo "PR from $head into $base breaks the branch flow"; exit 1; }

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check project formatting
        run: |
          git ls-files -z -- \
            'bsp/*.[ch]' 'drivers/*.[ch]' \
            'middleware/*.[ch]' 'platform/*.[ch]' 'tests/*.[ch]' \
            ':!drivers/CMSIS/**' ':!drivers/STM32G4xx_HAL_Driver/**' ':!drivers/BSP/**' |
            xargs -0 -r clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - run: cmake --preset release
      - run: cmake --build --preset release
      - uses: actions/upload-artifact@v4
        with:
          name: sensing-firmware
          path: |
            build/sensing.elf
            build/sensing.bin
            build/sensing.map
