name: CI

on:
  push:
    branches: [Developing, Maintaining, Validating]
  pull_request:
    branches: [Developing, Maintaining, Validating, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flow:
    runs-on: ubuntu-24.04
    steps:
      - name: Check push branch
        if: github.event_name == 'push'
        run: |
          case "$GITHUB_REF" in
            refs/heads/Developing|refs/heads/Maintaining|refs/heads/Validating)
              echo "Push to $GITHUB_REF_NAME follows the branch flow"
              ;;
            *)
              echo "Push to $GITHUB_REF breaks the branch flow"
              exit 1
              ;;
          esac

      - name: Check pull request branch flow
        if: github.event_name == 'pull_request'
        env:
          base: ${{ github.base_ref }}
          head: ${{ github.head_ref }}
        run: |
          case "$base" in
            Developing) [[ "$head" == Feature/* || "$head" == Fix/* || "$head" == Docs/* || "$head" == Chore/* || "$head" == feature/* || "$head" == fix/* || "$head" == docs/* || "$head" == chore/* || "$head" == "GeneratingTheProject" ]] ;;
            Maintaining) [[ "$head" == "Developing" ]] ;;
            Validating) [[ "$head" == "Maintaining" ]] ;;
            main) [[ "$head" == "Validating" ]] ;;
            *) false ;;
          esac || { echo "PR from $head into $base breaks the branch flow"; exit 1; }

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check project formatting
        run: |
          git ls-files -z -- \
            'bsp/*.[ch]' 'drivers/*.[ch]' \
            'middleware/*.[ch]' 'platform/*.[ch]' 'tests/*.[ch]' \
            ':!drivers/CMSIS/**' ':!drivers/STM32G4xx_HAL_Driver/**' ':!drivers/BSP/**' |
            xargs -0 -r clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - run: cmake --preset release
      - run: cmake --build --preset release
      - uses: actions/upload-artifact@v4
        with:
          name: sensing-firmware
          path: |
            build/sensing.elf
            build/sensing.bin
            build/sensing.map
